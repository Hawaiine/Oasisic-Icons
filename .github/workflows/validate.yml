name: Validate Icons

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Pillow + numpy
        # numpy 是 scripts/normalize-icons.py（被测模块）的运行依赖；
        # 其契约测试 tests/test_normalize_compliance.py 会 import 该模块。
        run: pip install Pillow numpy

      - name: Validate Oasisic-Icons repository
        run: python3 scripts/ci-validate-icons.py

      - name: Validate documentation icon references
        run: python3 scripts/ci-validate-docs.py

      - name: Run brand relationship tests
        run: python3 -m unittest discover -s tests -v
