name: Validate Icons

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Validate Oasisic-Icons repository
        run: python3 scripts/ci-validate-icons.py

      - name: Run brand relationship tests
        run: python3 -m unittest discover -s tests -v
