name: 每日图标同步

on:
  schedule:
    # 北京时间每天早上 8:00 运行 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl

      - name: 同步上游图标
        run: bash scripts/sync-upstream.sh

      - name: 强制重新生成配置
        run: |
          bash scripts/generate-icon-json.sh
          bash scripts/generate-category-readmes.sh

      - name: 校验所有图标与配置
        run: python3 scripts/ci-validate-icons.py

      - name: 提交并推送更新
        run: |
          git add icons/ config/ scripts/ .github/workflows/ README.md docs/
          if [ -z "$(git status --porcelain)" ]; then
            echo "没有变更，跳过提交"
            exit 0
          fi
          git config user.name "Oasisic-Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BEIJING_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          CHANGED=$(git status --porcelain | wc -l)
          git commit -m "chore: 自动同步上游图标 ${BEIJING_TIME} (files: ${CHANGED})"
          git push